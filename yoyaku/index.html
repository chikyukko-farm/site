<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の畑、行く？ ── ちきゅうっ子ファーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#2b2722; --paper:#fbf7ee; --paper2:#f3ecdb;
    --yamabuki:#e8a800; --yamabuki-d:#c98a00; --yamabuki-l:#fce9b8;
    --leaf:#5c7148; --leaf-d:#3f5232; --clay:#bf6b3f; --gold:#c9a14a;
    --ink:#3f3a33; --muted:#928a7b; --border:#e0d6bf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--sumi);line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  .hero{background:linear-gradient(155deg,#fff5d6,#f3ecdb);border-bottom:3px solid var(--yamabuki);padding:30px 0 24px}
  .hero h1{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:24px;line-height:1.4}
  .hero .lead{font-size:13px;color:var(--ink);margin-top:8px}
  .hero .schedlink{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--yamabuki-d);
    text-decoration:none;border-bottom:1px solid var(--yamabuki);padding-bottom:2px}

  .namebar{background:var(--paper2);border-bottom:1px solid var(--border);padding:14px 0}
  .namebar .in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .namebar label{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
  .namebar input{flex:1;min-width:140px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:15px;font-family:'Zen Kaku Gothic New';background:#fff;color:var(--sumi)}
  .namebar input:focus{outline:none;border-color:var(--yamabuki)}
  .namebar .hint{font-size:11px;color:var(--muted);width:100%}

  section{padding:22px 0}
  .today{background:var(--sumi);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:20px}
  .today .lbl{font-size:11px;color:var(--yamabuki-l);letter-spacing:.15em;margin-bottom:6px}
  .today .big{display:flex;align-items:baseline;gap:8px}
  .today .big .n{font-family:'Zen Old Mincho',serif;font-size:38px;font-weight:900;color:var(--yamabuki)}
  .today .big .u{font-size:14px}
  .today .dt{font-size:13px;color:#d8cfc0;margin-top:6px}

  .act{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;border-left:4px solid var(--leaf)}
  .act.k-school{border-left-color:var(--clay)}
  .act.k-extra{border-left-color:#a8893c}
  .act.mine{background:#fffdf5;border-color:var(--yamabuki)}
  .act .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .act .kind{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--leaf);border-radius:20px;padding:2px 11px;margin-bottom:6px}
  .act.k-school .kind{background:var(--clay)} .act.k-extra .kind{background:#a8893c}
  .act .date{font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700}
  .act .place{font-size:12.5px;color:var(--muted);margin-top:2px}
  .act .task{margin-top:8px;font-size:13px;color:var(--ink);background:var(--paper2);border-radius:7px;padding:6px 11px;display:inline-block}
  .act .task b{color:var(--clay);margin-right:5px}
  .act .cnt{text-align:center;flex-shrink:0}
  .act .cnt .c{font-family:'Zen Old Mincho',serif;font-size:26px;font-weight:900;color:var(--yamabuki-d)}
  .act .cnt .cl{font-size:10.5px;color:var(--muted)}
  .act .youtag{margin-top:10px;font-size:12px;color:var(--leaf-d);font-weight:700}
  .act .actions{margin-top:12px}
  .btn{width:100%;border:none;border-radius:9px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Zen Kaku Gothic New'}
  .btn-go{background:var(--yamabuki);color:#fff}
  .btn-go:active{background:var(--yamabuki-d)}
  .btn-cancel{background:#fff;color:var(--muted);border:1px solid var(--border)}

  .status{text-align:center;font-size:12px;color:var(--muted);padding:10px}

  .admin{margin-top:26px;border-top:1px dashed var(--border);padding-top:18px}
  .admin summary{cursor:pointer;font-size:13px;color:var(--muted);font-family:'Zen Old Mincho',serif;list-style:none}
  .admin summary::-webkit-details-marker{display:none}
  .admin summary::before{content:"▸ ";color:var(--yamabuki-d)}
  .admin[open] summary::before{content:"▾ "}
  .arow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .arow .names{font-size:11.5px;color:var(--muted);margin-top:3px}
  .adminnote{font-size:11px;color:var(--muted);margin-top:10px;background:var(--paper2);border-radius:8px;padding:10px 12px}

  footer{background:var(--sumi);color:var(--paper2);text-align:center;padding:22px;font-size:11px;letter-spacing:.1em;font-family:'Zen Old Mincho',serif;margin-top:24px}
  @media(max-width:600px){.hero h1{font-size:21px}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>今日の畑、行く？🌱</h1>
    <p class="lead">行ける日を選んで「行く」を押すだけ。今、何人集まっているかがすぐ分かります。</p>
    <a class="schedlink" href="https://corerelease.my.canva.site/dahjtmj6syu">年間スケジュールを見る →</a>
  </div>
</header>

<div class="namebar">
  <div class="wrap in">
    <label>お名前</label>
    <input type="text" id="myname" placeholder="例：かとう" maxlength="20">
    <div class="hint">最初に一度だけ入れてください。次からは覚えています。</div>
  </div>
</div>

<div class="wrap">
  <section>
    <div class="today" id="today"></div>
    <div id="acts"></div>
    <div class="status" id="status"></div>

    <details class="admin">
      <summary>運営の方はこちら（参加者の名簿）</summary>
      <div id="admin-rows" style="margin-top:12px"></div>
      <div class="adminnote" id="adminnote"></div>
    </details>
  </section>
</div>

<footer>ちきゅうっ子ファーム ／ 奥むさしマーケット結　│　予約</footer>

<script>
(function(){
  // GASウェブアプリのURL（セットアップ後にここへ貼る）
  var GAS_URL='https://script.google.com/macros/s/AKfycbyroR9u94e6MU_rjxVxfL9Nk5g35olbe0X972Rr_hxAzBQwCPxiivlGNycWyxm30E3RWQ/exec';
  var NAME_KEY='yoyaku_name_v1';
  // 参加者どうしでお名前を見せるか。true にすると各活動カードに参加者名が並ぶ。
  // false のときは人数だけ（名簿は「運営の方はこちら」内のみ）。
  var SHOW_NAMES = false;

  var activities=[], signups=[];
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function getName(){try{return localStorage.getItem(NAME_KEY)||'';}catch(e){return '';}}
  function setStatus(t){$('status').textContent=t||'';}

  var nameInput=$('myname');
  nameInput.value=getName();
  nameInput.addEventListener('input',function(){try{localStorage.setItem(NAME_KEY,nameInput.value.trim());}catch(e){}});
  function myName(){return nameInput.value.trim();}
  function needName(){ if(!myName()){ nameInput.focus(); nameInput.style.borderColor='var(--clay)'; setTimeout(function(){nameInput.style.borderColor='';},900); return true;} return false; }

  // 予約人数を数える
  function countFor(actId){ return signups.filter(function(s){return s.activity_id==actId;}).length; }
  function joinedBy(actId,name){ return signups.some(function(s){return s.activity_id==actId && s.name==name;}); }
  function namesFor(actId){ return signups.filter(function(s){return s.activity_id==actId;}).map(function(s){return s.name;}); }

  function load(){
    if(!GAS_URL){ setStatus('準備中：GASのURLが設定されていません'); return; }
    setStatus('読み込み中…');
    fetch(GAS_URL).then(function(r){return r.json();}).then(function(d){
      if(!d.ok) throw new Error(d.error||'読み込み失敗');
      activities=d.activities||[]; signups=d.signups||[];
      setStatus(''); render();
    }).catch(function(e){ setStatus('読み込みエラー：'+e.message); });
  }

  function post(payload){
    setStatus('更新中…');
    return fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)})
      .then(function(r){return r.json();})
      .then(function(d){ if(!d.ok) throw new Error(d.error||'更新失敗'); setStatus(''); return d; })
      .catch(function(e){ setStatus('更新エラー：'+e.message); throw e; });
  }

  function signup(actId){ if(needName())return; post({action:'signup',activity_id:actId,name:myName()}).then(load); }
  function cancel(actId){ post({action:'cancel',activity_id:actId,name:myName()}).then(load); }

  function render(){
    var name=myName();
    // 一番近い活動（配列の先頭）
    if(activities.length){
      var t=activities[0], tc=countFor(t.id);
      $('today').innerHTML='<div class="lbl">◆ いちばん近い活動日</div>'
        +'<div class="big"><span class="n">'+tc+'</span><span class="u">人が参加予定</span></div>'
        +'<div class="dt">'+esc(t.date)+'　'+esc(t.label||'')+(t.task?'（'+esc(t.task)+'）':'')+'</div>';
    } else {
      $('today').innerHTML='<div class="lbl">◆ 活動日</div><div class="dt">まだ活動が登録されていません。</div>';
    }

    $('acts').innerHTML=activities.map(function(a){
      var kc=a.kind==='school'?'k-school':(a.kind==='extra'?'k-extra':'k-farm');
      var cnt=countFor(a.id), joined=name&&joinedBy(a.id,name);
      var capTxt=a.cap?('　/ 定員'+a.cap):'';
      var taskTxt=a.task?'<div class="task"><b>内容</b>'+esc(a.task)+'</div>':'';
      var youTxt=joined?'<div class="youtag">✓ あなたは参加予定です</div>':'';
      var memTxt='';
      if(SHOW_NAMES){
        var ns=namesFor(a.id);
        if(ns.length) memTxt='<div class="task"><b>参加予定</b>'+ns.map(esc).join('、')+'</div>';
      }
      return '<div class="act '+kc+(joined?' mine':'')+'">'
        +'<div class="ah"><div><span class="kind">'+esc(a.label||'活動')+'</span>'
          +'<div class="date">'+esc(a.date)+'</div><div class="place">'+esc(a.place||'')+capTxt+'</div>'+taskTxt+'</div>'
          +'<div class="cnt"><div class="c">'+cnt+'</div><div class="cl">人が参加予定</div></div></div>'
        +memTxt+youTxt
        +'<div class="actions">'+(joined
          ?'<button class="btn btn-cancel" data-cancel="'+a.id+'">やっぱり行けない</button>'
          :'<button class="btn btn-go" data-go="'+a.id+'">この日に行く</button>')+'</div>'
      +'</div>';
    }).join('');

    // 運営ビュー（名簿）
    $('admin-rows').innerHTML=activities.map(function(a){
      var names=namesFor(a.id);
      var nameStr=names.length?names.map(esc).join('、'):'（まだいません）';
      return '<div class="arow"><div><span>'+esc(a.date)+'</span> <span style="opacity:.6;font-size:12px">'+esc(a.label||'')+'</span>'
        +'<div class="names">'+nameStr+'</div></div><span>'+names.length+' 人</span></div>';
    }).join('');

    $('acts').querySelectorAll('button[data-go]').forEach(function(b){
      b.addEventListener('click',function(){ signup(b.getAttribute('data-go')); });
    });
    $('acts').querySelectorAll('button[data-cancel]').forEach(function(b){
      b.addEventListener('click',function(){ cancel(b.getAttribute('data-cancel')); });
    });
  }

  $('adminnote').textContent = SHOW_NAMES
    ? '参加するみなさんにも、参加予定の方のお名前が表示されています。'
    : 'お名前は運営だけが見られます。参加するみなさんには「人数」だけが表示されます。';

  load();
})();
</script>

</body>
</html>
